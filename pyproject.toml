[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-mcp"
version = "0.1.0"
description = "轻量 MCP server：为纯文本主模型补齐视觉能力（图片理解 / OCR）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "Pillow>=10.0.0",
]

# 非包项目：脚本直接运行，不作为可分发包安装，避免 setuptools 自动发现报错
[tool.setuptools]
packages = []
